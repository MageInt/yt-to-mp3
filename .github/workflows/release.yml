name: Build, test & release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Unit tests & builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Backend — install, typecheck, test, build, audit
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high

      - name: Frontend — install, build, audit
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high

  release:
    name: Docker image & GitHub release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            if grep -q '#major' <<< "$COMMIT_MESSAGE"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -q '#minor' <<< "$COMMIT_MESSAGE"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="v${major}.${minor}.${patch}"
          fi
          echo "Last: ${last:-none} → next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: yt-to-mp3:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name app -p 8080:8080 yt-to-mp3:ci
          for _ in $(seq 1 30); do
            curl -fs http://localhost:8080/api/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: E2E tests (offline subset)
        working-directory: e2e
        env:
          CI: "true"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:offline

      - name: Container logs on failure
        if: failure()
        run: docker logs app

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --notes "Docker image: \`docker pull ${IMAGE}:${VERSION#v}\`"
