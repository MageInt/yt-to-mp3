# CI, image Docker, extensions et release automatique.
# - PR : tests unitaires et builds (backend, frontend, extension), analyse Trivy,
#   image construite et testée par Playwright (sous-ensemble hors ligne), sans publication.
#   Les PR Dependabot mineures et correctives sont ensuite fusionnées seules.
# - Push sur main : idem, puis version suivante (commits conventionnels, ou #minor /
#   #major dans le message), image multi-arch publiée sur GHCR (latest, X.Y.Z, X.Y,
#   sha-…) et release GitHub avec les extensions Firefox et Chromium en pièces jointes.
# - Dimanche (cron hebdomadaire) : publie la release qu'une fusion faite par un bot
#   n'a pas déclenchée (un push du GITHUB_TOKEN ne déclenche aucun workflow) ; si HEAD
#   est déjà taguée, rien n'est publié et les tests ne tournent pas.
# - En PR, seule l'image amd64 est construite ; arm64 uniquement à la publication.
# - Après chaque publication et chaque dimanche, le job cleanup purge GHCR.
# Actions épinglées sur un SHA de commit, mises à jour par Dependabot.
name: CI / Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Sur le cron hebdomadaire, ne tourne que si une image sera publiée (voir version).
    needs: version
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.version.outputs.release == 'true') }}
    name: Tests unitaires et builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
            extension/package-lock.json
      - name: Backend — install, typecheck, tests, build, audit
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Frontend — install, build, audit
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high
      # web-ext est un outil de dev (rien de node_modules n'est livré dans l'extension) ;
      # son alerte node-forge n'a pas de version corrigée : pas d'audit ici. Voir docs/extension.md.
      - name: Extension — install, lint
        working-directory: extension
        run: |
          npm ci
          npm run lint

  scan:
    # Sur le cron hebdomadaire, ne tourne que si une image sera publiée (voir version).
    needs: version
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.version.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances vulnérables, secrets et mauvaises configurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        name: Version suivante (feat ou #minor → mineure, ! / BREAKING CHANGE / #major → majeure, sinon correctif)
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${HEAD_MSG:-}" == *"[skip release]"* ]] || git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [[ -z "$last" ]]; then
            next=v1.0.0
          else
            log=$(git log --format='%s%n%b' "$last..HEAD")
            IFS=. read -r ma mi pa <<< "${last#v}"
            if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE|#major' <<< "$log"; then next="v$((ma + 1)).0.0"
            elif grep -qE '^feat(\([^)]*\))?:|#minor' <<< "$log"; then next="v$ma.$((mi + 1)).0"
            else next="v$ma.$mi.$((pa + 1))"; fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Version : $next" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Image Docker et tests e2e
    needs: [test, scan, version]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.scan.result == 'success' && (github.event_name == 'pull_request' || needs.version.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nom de l'image (GHCR exige des minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - if: github.event_name != 'pull_request' # arm64 seulement quand on publie
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image amd64 locale pour les tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: yt-to-mp3:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Démarrage du conteneur
        run: |
          docker run -d --name app -p 8080:8080 yt-to-mp3:ci
          for _ in $(seq 1 30); do
            curl -fs http://localhost:8080/api/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # Les tests @network sont exclus : YouTube bloque souvent les IP de la CI.
      - name: Tests e2e (sous-ensemble hors ligne)
        working-directory: e2e
        env:
          CI: "true"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:offline
      - name: Journaux du conteneur en cas d'échec
        if: failure()
        run: docker logs app
      - name: Analyse de l'image (bloque la publication)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: yt-to-mp3:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ needs.version.outputs.release == 'true' }}
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=sha,format=short,enable=${{ needs.version.outputs.release == 'true' }}
      - name: Construction multi-arch (amd64 et arm64) et publication
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release GitHub et extensions
    needs: [version, image]
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Paquets des extensions (Firefox + Chromium/Brave, non signés)
        working-directory: extension
        run: |
          npm ci
          npm run package
      - name: Tag et release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --notes "Docker image: \`docker pull ${image}:${VERSION#v}\` (linux/amd64, linux/arm64). Browser extensions for Firefox and Chromium/Brave (unsigned, see docs/extension.md) attached." \
            extension/dist/packages/*.zip

  # Fusionne les PR Dependabot groupées « mineures » (correctifs et mineures) une fois
  # les tests, l'analyse, l'image et les tests e2e réussis. Les majeures restent à relire.
  dependabot-merge:
    needs: [test, scan, image]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(github.event.pull_request.head.ref, '-mineures')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write # relancer ce workflow sur main
    steps:
      - name: Fusion et publication
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr merge --squash --delete-branch "$PR_URL"
          # Un merge fait avec GITHUB_TOKEN ne déclenche pas le push : on lance la release à la main.
          gh workflow run release.yml --ref main

  # Nettoyage de GHCR après une publication et chaque semaine : garde les 10 dernières
  # images taguées (et « latest »), supprime les non taguées, les attestations
  # orphelines et les multi-arch incomplètes. ghcr-cleanup-action gère les index
  # multi-arch, contrairement à actions/delete-package-versions qui les casse.
  cleanup:
    needs: [image]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.image.result == 'success' || (github.event_name == 'schedule' && needs.image.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Anciennes versions de l'image
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: yt-to-mp3
          keep-n-tagged: 10
          exclude-tags: latest
          delete-untagged: true
          delete-orphaned-images: true
          delete-ghost-images: true
          delete-partial-images: true
