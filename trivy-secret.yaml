# Configuration du scanner de secrets de Trivy (chargée automatiquement depuis
# la racine du dépôt, où s'exécute trivy-action).
#
# Exception unique et ciblée : l'extracteur Shahid de yt-dlp (installé depuis
# PyPI dans /opt/yt-dlp) contient en dur la clé d'accès AWS publique de l'API
# de Shahid, qui fait partie du code source amont de yt-dlp. Ce n'est pas un
# secret du projet : il n'y a rien à révoquer ni à corriger de notre côté, et
# supprimer l'extracteur casserait l'import de yt-dlp. Toutes les autres règles
# restent actives, y compris sur le reste de yt-dlp.
allow-rules:
  - id: yt-dlp-shahid-public-key
    description: Clé publique de l'API Shahid embarquée par yt-dlp (code amont)
    path: 'opt/yt-dlp/lib/python3\.[0-9]+/site-packages/yt_dlp/extractor/shahid\.py$'
