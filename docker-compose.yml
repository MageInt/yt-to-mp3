services:
  app:
    # `docker compose up` pulls the released image; `docker compose up --build` builds from source.
    image: ghcr.io/mageint/yt-to-mp3:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-to-mp3
    ports:
      - "8080:8080"
    environment:
      # See docs/configuration.md for all options.
      # Download queue: parallel downloads (server / per user), queue bounds
      MAX_CONCURRENT_JOBS: "3"
      MAX_PARALLEL_PER_SESSION: "1"
      MAX_JOBS_PER_SESSION: "5"
      MAX_QUEUE_SIZE: "50"
      MAX_QUEUE_WAIT_MINUTES: "30"
      # Send the user's browser User-Agent to YouTube (matches their cookies)
      FORWARD_USER_AGENT: "true"
      # Download whole playlists from `list=` links (default: only the video in the URL)
      ENABLE_PLAYLISTS: "false"
      MAX_PLAYLIST_ITEMS: "50"
      JOB_TTL_MINUTES: "30"
      DOWNLOAD_TIMEOUT_MINUTES: "10"
      RATE_LIMIT_WINDOW_MINUTES: "15"
      RATE_LIMIT_MAX: "20"
      # Route yt-dlp through an HTTP/SOCKS proxy, e.g. a Gluetun VPN: http://192.168.1.10:8890
      YTDLP_PROXY: ""
      # Netscape cookies.txt to get past YouTube's "not a bot" check (see docs/configuration.md)
      # YTDLP_COOKIES_FILE: /config/cookies.txt
      # Set to "true" behind a reverse proxy (Traefik, Nginx Proxy Manager…).
      TRUST_PROXY: "false"
    # volumes:
    #   - ./cookies.txt:/config/cookies.txt:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
