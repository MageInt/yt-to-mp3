services:
  app:
    # `docker compose up` pulls the released image; `docker compose up --build` builds from source.
    image: ghcr.io/mageint/yt-to-mp3:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-to-mp3
    ports:
      - "8080:8080"
    environment:
      # See docs/configuration.md for all options.
      MAX_CONCURRENT_JOBS: "3"
      MAX_PLAYLIST_ITEMS: "50"
      JOB_TTL_MINUTES: "30"
      DOWNLOAD_TIMEOUT_MINUTES: "10"
      RATE_LIMIT_WINDOW_MINUTES: "15"
      RATE_LIMIT_MAX: "20"
      # Set to "true" behind a reverse proxy (Traefik, Nginx Proxy Manager…).
      TRUST_PROXY: "false"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
